<div class="sidebar">
  <div class="container">
    <div class="sidebar-about">
      <h1>{{ site.title }}</h1>
      <p class="lead">{{ site.description }}</p>
    </div>

    <nav aria-label="Main navigation">
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item{% if page.title == 'Home' %} active{% endif %}">
          <a href="{{ '/' | relative_url }}"{% if page.title == 'Home' %} aria-current="page"{% endif %}>Home</a>
        </li>
        <li class="sidebar-nav-item{% if page.title == 'Research' %} active{% endif %}">
          <a href="{{ '/research/' | relative_url }}"{% if page.title == 'Research' %} aria-current="page"{% endif %}>Research</a>
        </li>
        <li class="sidebar-nav-item{% if page.title == 'Publications' %} active{% endif %}">
          <a href="{{ '/publications/' | relative_url }}"{% if page.title == 'Publications' %} aria-current="page"{% endif %}>Publications</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="https://github.com/rsbiello">GitHub</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
